<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>João Vitor Oliveira</title>
    <meta
      name="description"
      content="Software Engineer · Solutions Engineer · AI Researcher"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5f7fa;
        --card: #fff;
        --text: #354765;
        --head: #121822;
        --line: #e4e9f2;
        --accent: #3d8bf2;
        --grad: linear-gradient(120deg, #89f7fe 0%, #66a6ff 100%);
        --link: #629feb;
        --chip: #2b4c80;
        --chipt: #fff;
        --icon: #8497bc;
        --icont: #fff;
        --soft: #e4e9f2;
        --shadow: 0 0.5rem 2rem rgba(18, 24, 34, 0.07);
        --navbg: rgba(245, 247, 250, 0.85);
        --tag: #eaedf5;
        --tagt: #2b4c80;
        --tagc: #e3f1ff;
        --tagct: #2f7be0;
      }
      :root[data-theme="dark"] {
        --bg: #14132a;
        --card: #1c1b38;
        --text: #b4b2d8;
        --accent: #89c8ff;
        --head: #fff;
        --line: rgba(255, 255, 255, 0.14);
        --chip: rgba(0, 0, 0, 0.25);
        --chipt: rgba(255, 255, 255, 0.85);
        --icon: rgba(0, 0, 0, 0.2);
        --icont: #d7dde9;
        --soft: #14132a;
        --shadow: none;
        --navbg: rgba(20, 19, 42, 0.85);
        --tag: rgba(255, 255, 255, 0.08);
        --tagt: #c9c7ee;
        --tagc: rgba(102, 166, 255, 0.18);
        --tagct: #a9d4ff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        transition: background 0.3s;
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      svg {
        width: 1em;
        height: 1em;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: -0.125em;
      }
      .tools {
        display: flex;
        gap: 6px;
        flex: none;
        padding-left: 1rem;
        border-left: 1px solid var(--line);
      }
      .pill {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--chip);
        background: var(--card);
        border: 0;
        box-shadow: 0 0.125rem 0.35rem rgba(0, 0, 0, 0.1);
        cursor: pointer;
        font:
          700 0.7rem Inter,
          sans-serif;
        transition: 0.25s;
      }
      :root[data-theme="dark"] .pill {
        color: #d7dde9;
        background: #2a2950;
      }
      .pill:hover {
        color: var(--link);
        transform: translateY(-2px);
      }
      .wrap {
        position: relative;
        max-width: 980px;
        margin: 96px 16px 40px;
        padding-top: calc(80px + 1rem);
        background: var(--card);
        border-radius: 1.25rem;
        box-shadow: var(--shadow);
      }
      @media (min-width: 1012px) {
        .wrap {
          margin-inline: auto;
        }
      }
      .avatar {
        position: absolute;
        left: 50%;
        top: -80px;
        margin-left: -80px;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        border: 8px solid var(--card);
        display: grid;
        place-items: center;
        font-size: 3rem;
        font-weight: 800;
        color: #fff;
        background: var(--grad);
        object-fit: cover;
      }
      .head {
        text-align: center;
        padding: 0 clamp(16px, 5vw, 48px);
      }
      .head h1 {
        font-size: clamp(1.35rem, 4.2vw, 2rem);
        letter-spacing: clamp(0.1rem, 0.8vw, 0.4rem);
        text-transform: uppercase;
        font-weight: 900;
        color: var(--head);
        line-height: 1.25;
      }
      .role {
        margin-top: 0.5rem;
        font-size: 0.9rem;
        letter-spacing: 0.12rem;
        text-transform: uppercase;
        font-weight: 500;
      }
      .contact {
        list-style: none;
        margin-top: 1.5rem;
        padding: 1rem;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem 2rem;
        font-size: 0.875rem;
      }
      .contact a {
        color: var(--text);
      }
      .contact a:hover {
        color: var(--link);
      }
      .contact svg {
        margin-right: 0.5rem;
        color: var(--accent);
        font-size: 1.1rem;
      }
      .body {
        display: grid;
        grid-template-columns: 1fr;
        padding: clamp(20px, 4vw, 48px);
      }
      section {
        padding: 1.7rem 0;
        border-top: 1px solid var(--line);
      }
      section:first-child {
        border: 0;
        padding-top: 0;
      }
      section:last-child {
        padding-bottom: 0;
      }
      h2 {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        font-size: 0.95rem;
        letter-spacing: 0.12rem;
        text-transform: uppercase;
        font-weight: 900;
        color: var(--head);
        margin-bottom: 1.1rem;
      }
      .hi {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--icon);
        color: var(--icont);
        font-size: 1.05rem;
        flex: none;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
        gap: 10px;
        margin-top: 1.3rem;
      }
      .stat {
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        padding: 0.7rem;
        text-align: center;
      }
      .stat b {
        display: block;
        font-size: 1.15rem;
        color: var(--accent);
      }
      .stat small {
        font-size: 0.72rem;
      }
      .tl {
        position: relative;
        padding-left: 2.5rem;
      }
      .tl::before {
        content: "";
        position: absolute;
        left: 13px;
        top: 12px;
        bottom: 0;
        width: 3px;
        background: var(--line);
      }
      .ti {
        position: relative;
        padding-bottom: 2rem;
      }
      .ti:last-child {
        padding-bottom: 0;
      }
      .ti::before {
        content: "";
        position: absolute;
        left: -30px;
        top: 3px;
        width: 10px;
        height: 10px;
        border: 2px solid var(--icon);
        background: var(--soft);
        border-radius: 50%;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 0.75rem;
      }
      .co {
        background: var(--soft);
        padding: 0.2rem 0.5rem;
        border-radius: 0.25rem;
        font-weight: 600;
        text-align: right;
      }
      :root[data-theme="dark"] .co {
        background: rgba(0, 0, 0, 0.2);
      }
      .ti h3 {
        font-size: 1.1rem;
        color: var(--head);
        margin: 0.35rem 0 0.5rem;
        line-height: 1.3;
      }
      .ti ul {
        padding-left: 1rem;
        font-size: 0.92rem;
      }
      .ti li {
        margin-bottom: 0.45rem;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        background: var(--chip);
        color: var(--chipt);
        font-size: 0.74rem;
        font-weight: 600;
        padding: 0.35rem 0.6rem;
        border-radius: 0.375rem;
      }
      .sm {
        font-size: 0.85rem;
      }
      .sm div {
        margin-bottom: 0.8rem;
      }
      .sm b {
        display: block;
        color: var(--head);
        font-size: 0.875rem;
      }
      .sm span {
        display: block;
      }
      .cert {
        list-style: none;
        font-size: 0.85rem;
        display: grid;
        gap: 0.5rem;
      }
      .cert li {
        padding-left: 0.95rem;
        position: relative;
      }
      .cert li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.55em;
        width: 0.4rem;
        height: 0.4rem;
        background: var(--icon);
      }
      footer {
        text-align: center;
        font-size: 0.75rem;
        padding: 0 16px 30px;
      }
      @media print {
        body {
          background: #fff;
        }
        .wrap {
          box-shadow: none;
          margin-top: 90px;
        }
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.4rem 16px;
      }
      .bar::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: var(--navbg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .menu,
      .scrim {
        display: none;
      }
      .nav {
        flex: 1;
        min-width: 0;
        display: flex;
        gap: 1.4rem;
        overflow-x: auto;
        scrollbar-width: none;
        padding: 0.25rem 0;
        font-size: 0.76rem;
        letter-spacing: 0.04em;
      }
      .nav::-webkit-scrollbar {
        display: none;
      }
      .nav a {
        color: var(--text);
        opacity: 0.65;
        white-space: nowrap;
        padding: 0.15rem 0;
        border-bottom: 2px solid transparent;
        transition: 0.2s;
      }
      .nav a:first-child {
        margin-left: auto;
      }
      .nav a:last-child {
        margin-right: auto;
      }
      .nav a:hover {
        opacity: 1;
        text-decoration: none;
      }
      .nav a.on {
        opacity: 1;
        color: var(--accent);
        border-color: var(--accent);
      }
      @media (max-width: 700px) {
        .menu {
          display: grid;
        }
        .bar {
          justify-content: space-between;
        }
        .tools {
          border: 0;
          padding: 0;
        }
        .nav {
          position: fixed;
          top: 0;
          left: 0;
          bottom: 0;
          z-index: 50;
          width: min(270px, 80vw);
          flex: none;
          flex-direction: column;
          gap: 0.25rem;
          overflow-y: auto;
          padding: 4.5rem 1rem 1.5rem;
          background: var(--card);
          box-shadow: 0.5rem 0 2rem rgba(0, 0, 0, 0.2);
          font-size: 0.95rem;
          transform: translateX(-105%);
          transition:
            transform 0.3s,
            visibility 0.3s;
          visibility: hidden;
        }
        .nav.open {
          transform: none;
          visibility: visible;
        }
        .nav a {
          padding: 0.6rem 0.85rem;
          border-bottom: 0;
          border-left: 3px solid transparent;
          border-radius: 0 0.4rem 0.4rem 0;
        }
        .nav a:first-child {
          margin-left: 0;
        }
        .nav a:last-child {
          margin-right: 0;
        }
        .nav a.on {
          background: var(--tag);
        }
        .scrim {
          display: block;
          position: fixed;
          inset: 0;
          z-index: 45;
          background: rgba(0, 0, 0, 0.4);
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.3s;
        }
        .scrim.show {
          opacity: 1;
          pointer-events: auto;
        }
      }
      html {
        scroll-padding-top: 56px;
      }
      section {
        scroll-margin-top: 56px;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 0.7rem;
      }
      .tags .tag {
        display: inline-block;
        font-size: 0.66rem;
        font-weight: 500;
        line-height: 1.4;
        padding: 0.1rem 0.45rem;
        border-radius: 999px;
        background: var(--tag);
        color: var(--tagt);
      }
      .tags .tag.c {
        background: var(--tagc);
        color: var(--tagct);
      }
      .hl {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 12px;
      }
      @media (max-width: 600px) {
        .hl {
          grid-template-columns: 1fr;
        }
      }
      .hlc {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: 0.75rem;
        overflow: hidden;
        color: var(--text);
        transition: 0.25s;
      }
      .hlc:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        text-decoration: none;
      }
      .hlc img {
        width: 100%;
        height: 140px;
        object-fit: cover;
        display: block;
        background: var(--grad);
      }
      .hlb {
        padding: 0.9rem 1rem;
      }
      .hlb .k {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 0.3rem;
      }
      .hlb b {
        display: block;
        color: var(--head);
        font-size: 0.95rem;
        line-height: 1.3;
      }
      .hlb p {
        font-size: 0.82rem;
        margin-top: 0.3rem;
      }
      .totop {
        position: fixed;
        right: 20px;
        bottom: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 0;
        background: var(--grad);
        color: #fff;
        font-size: 1.2rem;
        cursor: pointer;
        display: grid;
        place-items: center;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.2);
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition: 0.25s;
      }
      .totop.show {
        opacity: 1;
        pointer-events: auto;
        transform: none;
      }
      .totop:hover {
        filter: brightness(1.08);
      }
      @media print {
        .bar,
        .totop {
          display: none;
        }
      }
    </style>
  </head>
